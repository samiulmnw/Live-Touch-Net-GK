<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Lily!</title>
    <!-- স্টাইলিশ ফন্ট ইমপোর্ট -->
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* প্রিমিয়াম ডার্ক পার্পল-পিংক গ্রেডিয়েন্ট ব্যাকগ্রাউন্ড */
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #ffffff;
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* ব্যাকগ্রাউন্ড কনফেটির জন্য ক্যানভাস */
        #confetti {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .container {
            position: relative;
            z-index: 10;
            max-width: 1200px;
            margin: 0 auto;
            padding: 50px 20px;
            text-align: center;
        }

        /* স্টাইলিশ টেক্সট ডিজাইন */
        .title {
            font-family: 'Great Vibes', cursive;
            font-size: 5rem;
            color: #ff9a9e;
            text-shadow: 0 0 10px rgba(255, 154, 158, 0.6), 0 0 20px rgba(255, 154, 158, 0.4);
            margin-bottom: 10px;
            animation: glow 2s ease-in-out infinite alternate;
        }

        .subtitle {
            font-size: 1.2rem;
            font-weight: 300;
            color: #e0e0e0;
            max-width: 600px;
            margin: 0 auto 50px auto;
            line-height: 1.6;
            letter-spacing: 1px;
        }

        /* ছবির গ্যালারি - ফ্লেক্সবক্স দিয়ে সাজানো */
        .gallery {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 40px;
            margin-top: 20px;
        }

        /* হার্ট শেপের কন্টেইনার এবং এদিক-ওদিক নাড়াচাড়ার অ্যানিমেশন */
        .heart-wrapper {
            width: 250px;
            height: 250px;
            position: relative;
            filter: drop-shadow(0 15px 25px rgba(255, 105, 180, 0.4));
            animation: float 5s ease-in-out infinite;
            transition: transform 0.4s ease;
        }

        .heart-wrapper:hover {
            transform: scale(1.1) translateY(-10px);
            z-index: 20;
        }

        /* প্রতিটি ছবিকে আলাদা সময়ে নাড়ানোর জন্য Delay */
        .heart-wrapper:nth-child(1) { animation-delay: 0.0s; animation-duration: 6s; }
        .heart-wrapper:nth-child(2) { animation-delay: 1.2s; animation-duration: 5.5s; }
        .heart-wrapper:nth-child(3) { animation-delay: 0.5s; animation-duration: 7s; }
        .heart-wrapper:nth-child(4) { animation-delay: 2.1s; animation-duration: 6.5s; }
        .heart-wrapper:nth-child(5) { animation-delay: 1.8s; animation-duration: 5.8s; }
        .heart-wrapper:nth-child(6) { animation-delay: 0.9s; animation-duration: 6.2s; }

        /* হার্ট শেপ কাটআউট (SVG Clip Path) */
        .heart-cutout {
            width: 100%;
            height: 100%;
            clip-path: url(#heart-clip);
            position: relative;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.1);
        }

        /* 
           ইমেজ কাটাকাটি না হওয়ার ম্যাজিক ট্রিক:
           পেছনে একটা ব্লার করা ইমেজ থাকবে, আর সামনে অরিজিনাল ইমেজটা থাকবে পুরোটা জুড়ে। 
        */
        .bg-blur {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: blur(15px);
            transform: scale(1.2);
            opacity: 0.7;
            z-index: 1;
        }

        .main-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain; /* ছবি যেন কোনোভাবেই না কাটে */
            transform: scale(0.9); /* হার্টের ভেতর একটু জায়গা ছেড়ে বসবে */
            z-index: 2;
        }

        /* অ্যানিমেশনগুলো */
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(-2deg); }
            50% { transform: translateY(-20px) rotate(2deg); }
        }

        @keyframes glow {
            from { text-shadow: 0 0 10px #ff9a9e, 0 0 20px #ff9a9e; }
            to { text-shadow: 0 0 20px #fecfef, 0 0 30px #fecfef; }
        }

        /* রেস্পন্সিভ ডিজাইন */
        @media (max-width: 768px) {
            .title { font-size: 3.5rem; }
            .heart-wrapper { width: 200px; height: 200px; gap: 20px;}
        }
    </style>
</head>
<body>

    <!-- হার্ট শেপের জন্য SVG Clip Path ডেফিনিশন (এটি স্ক্রিনে দেখা যাবে না, শুধু শেপ তৈরি করবে) -->
    <svg width="0" height="0">
        <defs>
            <clipPath id="heart-clip" clipPathUnits="objectBoundingBox">
                <!-- পারফেক্ট এবং স্মুথ একটি হার্ট শেপ -->
                <path d="M0.5,0.95 C0.1,0.6 0,0.45 0,0.25 C0,0.1 0.15,0 0.25,0 C0.35,0 0.45,0.1 0.5,0.2 C0.55,0.1 0.65,0 0.75,0 C0.85,0 1,0.1 1,0.25 C1,0.45 0.9,0.6 0.5,0.95 Z" />
            </clipPath>
        </defs>
    </svg>

    <!-- কনফেটি ইফেক্টের জন্য ক্যানভাস -->
    <canvas id="confetti"></canvas>

    <div class="container">
        <!-- স্টাইলিশ জন্মদিনের উইশ -->
        <h1 class="title">Happy Birthday Lily!</h1>
        <p class="subtitle">
            তোমার সামনের দিনগুলো অনেক সুন্দর, আনন্দময় ও শান্তিময় হোক। 
            জীবনের প্রতিটি মুহূর্ত কাটুক হাসি আর আনন্দে। শুভ জন্মদিন!
        </p>

        <!-- ছবির গ্যালারি -->
        <div class="gallery">
            <!-- ইমেজ ১ -->
            <div class="heart-wrapper">
                <div class="heart-cutout">
                    <img class="bg-blur" src="https://i.ibb.co.com/vCXmFdsk/Messenger-creation-32-E4-A31-A-BBB2-4-F54-944-D-EEEEDB4021-CC.jpg" alt="blur">
                    <img class="main-img" src="https://i.ibb.co.com/vCXmFdsk/Messenger-creation-32-E4-A31-A-BBB2-4-F54-944-D-EEEEDB4021-CC.jpg" alt="Lily">
                </div>
            </div>

            <!-- ইমেজ ২ -->
            <div class="heart-wrapper">
                <div class="heart-cutout">
                    <img class="bg-blur" src="https://i.ibb.co.com/0jzzcfz1/Messenger-creation-A25-B01-BC-DF61-43-A6-B2-AF-3-A9-DE21-CE657.jpg" alt="blur">
                    <img class="main-img" src="https://i.ibb.co.com/0jzzcfz1/Messenger-creation-A25-B01-BC-DF61-43-A6-B2-AF-3-A9-DE21-CE657.jpg" alt="Lily">
                </div>
            </div>

            <!-- ইমেজ ৩ -->
            <div class="heart-wrapper">
                <div class="heart-cutout">
                    <img class="bg-blur" src="https://i.ibb.co.com/8TnLm40/Messenger-creation-FB04-FE86-6092-4-DBC-A58-E-36-EEA4-D5-F052.jpg" alt="blur">
                    <img class="main-img" src="https://i.ibb.co.com/8TnLm40/Messenger-creation-FB04-FE86-6092-4-DBC-A58-E-36-EEA4-D5-F052.jpg" alt="Lily">
                </div>
            </div>

            <!-- ইমেজ ৪ -->
            <div class="heart-wrapper">
                <div class="heart-cutout">
                    <img class="bg-blur" src="https://i.ibb.co.com/mCyC6Zpc/Messenger-creation-32671-EF5-9-F43-42-D0-BB19-F60-DE965-C770.jpg" alt="blur">
                    <img class="main-img" src="https://i.ibb.co.com/mCyC6Zpc/Messenger-creation-32671-EF5-9-F43-42-D0-BB19-F60-DE965-C770.jpg" alt="Lily">
                </div>
            </div>

            <!-- ইমেজ ৫ -->
            <div class="heart-wrapper">
                <div class="heart-cutout">
                    <img class="bg-blur" src="https://i.ibb.co.com/ynzQq8rK/Messenger-creation-FAED8784-C9-F9-4-F14-B00B-588-F8-F2-C6-E20.jpg" alt="blur">
                    <img class="main-img" src="https://i.ibb.co.com/ynzQq8rK/Messenger-creation-FAED8784-C9-F9-4-F14-B00B-588-F8-F2-C6-E20.jpg" alt="Lily">
                </div>
            </div>

            <!-- ইমেজ ৬ -->
            <div class="heart-wrapper">
                <div class="heart-cutout">
                    <img class="bg-blur" src="https://i.ibb.co.com/hxdGwBDm/Messenger-creation-197-E181-A-B2-F3-45-D0-9124-83596-F7083-BE.jpg" alt="blur">
                    <img class="main-img" src="https://i.ibb.co.com/hxdGwBDm/Messenger-creation-197-E181-A-B2-F3-45-D0-9124-83596-F7083-BE.jpg" alt="Lily">
                </div>
            </div>
        </div>
    </div>

    <!-- কনফেটি (পার্টিকেল) ইফেক্টের জন্য জাভাস্ক্রিপ্ট -->
    <script>
        const canvas = document.getElementById('confetti');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const pieces = [];
        const colors = ['#ff9a9e', '#fecfef', '#ffffff', '#ffb6c1', '#ffd700'];

        for (let i = 0; i < 100; i++) {
            pieces.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                vx: (Math.random() - 0.5) * 2,
                vy: Math.random() * 2 + 1,
                size: Math.random() * 6 + 4,
                color: colors[Math.floor(Math.random() * colors.length)],
                rotation: Math.random() * 360,
                rotationSpeed: (Math.random() - 0.5) * 5
            });
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            pieces.forEach(p => {
                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate(p.rotation * Math.PI / 180);
                ctx.fillStyle = p.color;
                ctx.globalAlpha = 0.8;
                ctx.beginPath();
                ctx.arc(0, 0, p.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();

                p.y += p.vy;
                p.x += p.vx;
                p.rotation += p.rotationSpeed;

                if (p.y > canvas.height) {
                    p.y = -10;
                    p.x = Math.random() * canvas.width;
                }
            });
            requestAnimationFrame(render);
        }

        render();

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
