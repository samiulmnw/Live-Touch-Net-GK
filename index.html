<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SH Online TV - FIFA World Cup Edition '26</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.06);
            --glass-border: rgba(255, 255, 255, 0.12);
            --glass-blur: blur(20px);
            --neon-gold: #ffcc00;
            --neon-glow: rgba(255, 204, 0, 0.4);
            --live-red: #ff3333;
        }

        /* কোনো টেক্সট যেন কপি বা সিলেক্ট না করা যায় */
        *, *::before, *::after {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            -webkit-touch-callout: none;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            color: #ffffff;
            /* আপনার দেওয়া ইমেজটি ফুলস্ক্রিন ব্যাকগ্রাউন্ড হিসেবে সেট করা হয়েছে */
            background: url('https://i.ibb.co.com/TMwvDFDc/Chat-GPT-Image-Jun-12-2026-12-10-59-PM.png') no-repeat center center fixed;
            background-size: cover;
        }

        /* ডার্ক ওভারলে ব্যাকগ্রাউন্ড ইমেজকে প্রিমিয়াম লুক দেওয়ার জন্য */
        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(0, 0, 0, 0.6), rgba(15, 23, 42, 0.75));
            z-index: 0;
        }

        /* প্রিমিয়াম ট্রান্সপারেন্ট হেডার */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 24px;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border-bottom: 1px solid var(--glass-border);
            z-index: 100;
        }

        .header-title {
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            font-size: 1.4rem;
            letter-spacing: 2px;
            background: linear-gradient(45deg, #ffffff, var(--neon-gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0px 0px 10px rgba(255, 204, 0, 0.2);
        }

        .menu-btn {
            font-size: 1.6rem;
            cursor: pointer;
            transition: transform 0.3s ease, color 0.3s;
            color: #ffffff;
        }

        .menu-btn:hover {
            color: var(--neon-gold);
            transform: scale(1.1);
        }

        /* কাচের মতো স্বচ্ছ সাইডবার (Glassmorphism Sidebar) */
        .sidebar {
            position: fixed;
            top: 0;
            left: -320px;
            width: 300px;
            height: 100%;
            background: rgba(10, 15, 30, 0.5);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-right: 1px solid var(--glass-border);
            box-shadow: 10px 0 30px rgba(0, 0, 0, 0.5);
            transition: all 0.5s cubic-bezier(0.77, 0.2, 0.05, 1);
            z-index: 200;
            padding-top: 90px;
        }

        .sidebar.active {
            left: 0;
        }

        .menu-item {
            display: flex;
            align-items: center;
            padding: 16px 28px;
            color: #e2e8f0;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: 500;
            transition: all 0.3s ease;
            border-left: 4px solid transparent;
            cursor: pointer;
            margin-bottom: 5px;
        }

        .menu-item i {
            margin-right: 18px;
            font-size: 1.3rem;
            width: 24px;
            text-align: center;
            color: #cbd5e1;
            transition: color 0.3s;
        }

        .menu-item:hover {
            background: rgba(255, 255, 255, 0.08);
            color: var(--neon-gold);
            border-left: 4px solid var(--neon-gold);
            padding-left: 35px;
        }

        .menu-item:hover i {
            color: var(--neon-gold);
        }

        /* স্মুথ ব্লার ওভারলে */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            opacity: 0;
            visibility: hidden;
            transition: all 0.4s ease;
            z-index: 150;
        }

        .overlay.active {
            opacity: 1;
            visibility: visible;
        }

        /* মেইন হোম স্ক্রিন কন্টেন্ট */
        .main-container {
            position: relative;
            z-index: 1;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
            animation: fadeIn 1.2s ease-out;
        }

        /* গ্লাস কার্ড ব্র্যান্ডিং বক্স */
        .brand-card {
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            padding: 40px 30px;
            border-radius: 28px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            margin-bottom: 40px;
            max-width: 400px;
            width: 100%;
        }

        .brand-card i {
            font-size: 4.5rem;
            color: var(--neon-gold);
            margin-bottom: 20px;
            filter: drop-shadow(0 0 15px var(--neon-glow));
            animation: float 3s ease-in-out infinite;
        }

        .brand-card h1 {
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            font-size: 2.2rem;
            margin: 0;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .brand-card p {
            margin: 8px 0 0 0;
            font-size: 1rem;
            color: #cbd5e1;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: 500;
        }

        /* অ্যানিমেটেড গ্লোয়িং লাইভ বাটন */
        .live-btn {
            background: linear-gradient(135deg, var(--live-red), #b91c1c);
            color: #ffffff;
            border: none;
            padding: 22px 65px;
            font-family: 'Montserrat', sans-serif;
            font-size: 1.8rem;
            font-weight: 900;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 30px rgba(255, 51, 51, 0.5);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-transform: uppercase;
            letter-spacing: 3px;
            display: flex;
            align-items: center;
            gap: 15px;
            animation: pulseGlow 2s infinite;
        }

        .live-btn:hover {
            transform: scale(1.06) translateY(-5px);
            box-shadow: 0 0 45px rgba(255, 51, 51, 0.8);
        }

        .live-btn:active {
            transform: scale(0.98) translateY(0);
        }

        /* কাস্টম ইন্টারনেট এরর গ্লাস পপআপ (Modal) */
        .modal-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .modal-wrapper.show {
            opacity: 1;
            visibility: visible;
        }

        .error-card {
            background: rgba(30, 20, 20, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 51, 51, 0.3);
            padding: 35px;
            border-radius: 24px;
            text-align: center;
            max-width: 340px;
            width: 90%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            transform: scale(0.8);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal-wrapper.show .error-card {
            transform: scale(1);
        }

        .error-card i {
            font-size: 3.5rem;
            color: var(--live-red);
            margin-bottom: 15px;
        }

        .error-card h3 {
            margin: 0 0 10px 0;
            font-size: 1.4rem;
            font-weight: 700;
        }

        .error-card p {
            margin: 0 0 25px 0;
            color: #94a3b8;
            font-size: 0.95rem;
            line-height: 1.4;
        }

        .close-modal-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 10px 30px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.3s;
        }

        .close-modal-btn:hover {
            background: white;
            color: black;
        }

        /* অ্যানিমেশন কি-ফ্রেম সমূহ */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 0 0 rgba(255, 51, 51, 0.6); }
            70% { box-shadow: 0 0 0 18px rgba(255, 51, 51, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 51, 51, 0); }
        }
    </style>
</head>
<body>

    <div class="bg-overlay"></div>

    <header class="header">
        <div class="menu-btn" onclick="toggleMenu()">
            <i class="fa-solid fa-bars-staggered"></i>
        </div>
        <div class="header-title">SH ONLINE</div>
        <div style="width: 25px;"></div> </header>

    <div class="overlay" id="overlay" onclick="closeMenu()"></div>

    <nav class="sidebar" id="sidebar">
        <a onclick="closeMenu()" class="menu-item">
            <i class="fa-solid fa-square-rss"></i> Home
        </a>
        <a href="https://wa.me/8801873228584" target="_blank" class="menu-item">
            <i class="fa-brands fa-whatsapp"></i> WhatsApp
        </a>
        <a href="https://t.me/sh_himel_official" target="_blank" class="menu-item">
            <i class="fa-brands fa-telegram"></i> Telegram
        </a>
        <a href="mailto:samiulmnw9@gmail.com" class="menu-item">
            <i class="fa-solid fa-envelope-open-text"></i> Email
        </a>
        <a href="mailto:samiulmnw9@gmail.com?subject=SH%20Online%20App%20Report" class="menu-item">
            <i class="fa-solid fa-triangle-exclamation"></i> Report
        </a>
    </nav>

    <main class="main-container">
        <div class="brand-card">
            <i class="fa-solid fa-trophy"></i>
            <h1>SH ONLINE</h1>
            <p>FIFA World Cup Edition</p>
        </div>
        
        <button class="live-btn" onclick="startLiveTV()">
            <i class="fa-solid fa-play"></i> LIVE NOW
        </button>
    </main>

    <div class="modal-wrapper" id="internetModal">
        <div class="error-card">
            <i class="fa-solid fa-wifi"></i>
            <h3>No Internet Connection</h3>
            <p>Please check your cellular data or Wi-Fi connection and try again.</p>
            <button class="close-modal-btn" onclick="closeModal()">OK</button>
        </div>
    </div>

    <script>
        // সাইডবার ওপেন ও ক্লোজ লজিক
        function toggleMenu() {
            document.getElementById('sidebar').classList.toggle('active');
            document.getElementById('overlay').classList.toggle('active');
        }
        
        function closeMenu() {
            document.getElementById('sidebar').classList.remove('active');
            document.getElementById('overlay').classList.remove('active');
        }

        // ইন্টারনেট কানেকশন ভ্যালিডেশন সহ লাইভ টিভি রিডাইরেকশন
        function startLiveTV() {
            if (navigator.onLine) {
                // কানেকশন ঠিক থাকলে সরাসরি আপনার লিংকে নিয়ে যাবে
                window.location.href = "http://172.20.5.50/";
            } else {
                // ইন্টারনেট না থাকলে কাস্টম গ্লাস পপআপ ওপেন হবে
                document.getElementById('internetModal').classList.add('show');
            }
        }

        // কাস্টম মডাল বন্ধ করার ফাংশন
        function closeModal() {
            document.getElementById('internetModal').classList.remove('show');
        }
    </script>
</body>
    </html>
