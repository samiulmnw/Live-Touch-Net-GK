<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>release by pro_version_labs- World Cup Edition '26</title>
    
    <!-- Fonts & Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800;900&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-gold: #FFD700;
            --primary-red: #E63946;
            --dark-glass: rgba(15, 23, 42, 0.65);
            --light-glass: rgba(255, 255, 255, 0.08);
            --border-glass: rgba(255, 255, 255, 0.15);
            --text-main: #F8FAFC;
            --text-muted: #94A3B8;
            --blur-heavy: blur(24px);
            --blur-light: blur(12px);
        }

        /* Anti-Copy & App Reset */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Poppins', sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            color: var(--text-main);
            background: #0B0F19;
        }

        /* Dynamic Background */
        .bg-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('https://i.ibb.co.com/TMwvDFDc/Chat-GPT-Image-Jun-12-2026-12-10-59-PM.png') no-repeat center center;
            background-size: cover;
            z-index: 0;
            transform: scale(1.05);
            animation: bgZoom 20s infinite alternate ease-in-out;
        }

        /* Premium Dark Overlay with Vignette */
        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, rgba(11, 15, 25, 0.4) 0%, rgba(11, 15, 25, 0.85) 100%);
            z-index: 1;
        }

        /* Premium Header */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 25px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.7), transparent);
            z-index: 100;
        }

        .menu-btn {
            font-size: 1.5rem;
            color: var(--text-main);
            cursor: pointer;
            transition: all 0.3s ease;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: var(--light-glass);
            backdrop-filter: var(--blur-light);
            border: 1px solid var(--border-glass);
        }

        .menu-btn:hover {
            color: var(--primary-gold);
            background: rgba(255, 255, 255, 0.15);
            transform: scale(1.05);
        }

        .header-title {
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            font-size: 1.3rem;
            letter-spacing: 3px;
            background: linear-gradient(135deg, #FFF, var(--primary-gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 4px 15px rgba(255, 215, 0, 0.3);
        }

        /* Empty div for flex balance */
        .header-spacer {
            width: 40px;
        }

        /* Glassmorphism Sidebar */
        .sidebar {
            position: fixed;
            top: 0;
            left: -320px;
            width: 280px;
            height: 100%;
            background: var(--dark-glass);
            backdrop-filter: var(--blur-heavy);
            -webkit-backdrop-filter: var(--blur-heavy);
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 20px 0 50px rgba(0, 0, 0, 0.5);
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            z-index: 200;
            padding-top: 100px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .sidebar.active {
            transform: translateX(320px);
        }

        .menu-item {
            display: flex;
            align-items: center;
            padding: 14px 30px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 1rem;
            font-weight: 500;
            transition: all 0.3s ease;
            position: relative;
            cursor: pointer;
        }

        .menu-item::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 3px;
            background: var(--primary-gold);
            transform: scaleY(0);
            transition: transform 0.3s ease;
        }

        .menu-item i {
            margin-right: 20px;
            font-size: 1.2rem;
            width: 24px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .menu-item:hover, .menu-item.active {
            color: #FFF;
            background: linear-gradient(90deg, rgba(255,215,0,0.1) 0%, transparent 100%);
            padding-left: 35px;
        }

        .menu-item:hover::before, .menu-item.active::before {
            transform: scaleY(1);
        }

        .menu-item:hover i, .menu-item.active i {
            color: var(--primary-gold);
        }

        /* Overlay */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            opacity: 0;
            visibility: hidden;
            transition: all 0.4s ease;
            z-index: 150;
        }

        .overlay.active {
            opacity: 1;
            visibility: visible;
        }

        /* Main Content */
        .main-container {
            position: relative;
            z-index: 10;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
        }

        /* Premium Brand Card */
        .brand-card {
            background: linear-gradient(145deg, rgba(255,255,255,0.05), rgba(255,255,255,0.01));
            backdrop-filter: var(--blur-heavy);
            -webkit-backdrop-filter: var(--blur-heavy);
            border: 1px solid var(--border-glass);
            padding: 50px 40px;
            border-radius: 32px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255,255,255,0.1);
            margin-bottom: 50px;
            width: 90%;
            max-width: 420px;
            animation: slideUpFade 1s cubic-bezier(0.25, 1, 0.5, 1) forwards;
            position: relative;
            overflow: hidden;
        }

        /* Subtle glowing orb inside card */
        .brand-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,215,0,0.05) 0%, transparent 60%);
            animation: rotateGlow 10s linear infinite;
        }

        .brand-card i.fa-trophy {
            font-size: 5rem;
            background: linear-gradient(135deg, #FFF, var(--primary-gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 25px;
            filter: drop-shadow(0 10px 15px rgba(255, 215, 0, 0.3));
            animation: float 4s ease-in-out infinite;
            display: inline-block;
        }

        .brand-card h1 {
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            font-size: 2.4rem;
            margin: 0;
            letter-spacing: 2px;
            color: #FFF;
        }

        .brand-card p {
            margin: 12px 0 0 0;
            font-size: 0.95rem;
            color: var(--primary-gold);
            letter-spacing: 4px;
            text-transform: uppercase;
            font-weight: 600;
        }

        /* Professional Live Button */
        .live-btn-wrapper {
            position: relative;
            animation: slideUpFade 1.2s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        /* Pulsing Rings */
        .live-btn-wrapper::before, .live-btn-wrapper::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            height: 100%;
            background: var(--primary-red);
            border-radius: 50px;
            z-index: -1;
            animation: ripple 2s infinite ease-out;
        }

        .live-btn-wrapper::after {
            animation-delay: 1s;
        }

        .live-btn {
            background: linear-gradient(135deg, #FF0033, #B30000);
            color: #ffffff;
            border: 1px solid rgba(255,255,255,0.2);
            padding: 20px 60px;
            font-family: 'Montserrat', sans-serif;
            font-size: 1.4rem;
            font-weight: 800;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(255, 0, 51, 0.4), inset 0 2px 0 rgba(255,255,255,0.2);
            transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            text-transform: uppercase;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            position: relative;
            overflow: hidden;
        }

        .live-btn i {
            font-size: 1.2rem;
            animation: blink 1.5s infinite;
        }

        .live-btn:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 15px 40px rgba(255, 0, 51, 0.6), inset 0 2px 0 rgba(255,255,255,0.3);
        }

        .live-btn:active {
            transform: translateY(2px) scale(0.98);
        }

        /* Internet Error Modal */
        .modal-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .modal-wrapper.show {
            opacity: 1;
            visibility: visible;
        }

        .error-card {
            background: var(--dark-glass);
            backdrop-filter: var(--blur-heavy);
            border: 1px solid rgba(230, 57, 70, 0.3);
            padding: 40px 30px;
            border-radius: 28px;
            text-align: center;
            max-width: 350px;
            width: 85%;
            box-shadow: 0 25px 50px rgba(0,0,0,0.6);
            transform: translateY(30px) scale(0.9);
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .modal-wrapper.show .error-card {
            transform: translateY(0) scale(1);
        }

        .error-card i {
            font-size: 3.5rem;
            color: var(--primary-red);
            margin-bottom: 20px;
            filter: drop-shadow(0 0 15px rgba(230, 57, 70, 0.4));
        }

        .error-card h3 {
            margin: 0 0 12px 0;
            font-size: 1.5rem;
            font-weight: 700;
            color: #FFF;
        }

        .error-card p {
            margin: 0 0 30px 0;
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .close-modal-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            padding: 14px 40px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            font-family: 'Poppins', sans-serif;
            transition: all 0.3s ease;
            width: 100%;
            letter-spacing: 1px;
        }

        .close-modal-btn:hover {
            background: #FFF;
            color: #000;
            box-shadow: 0 5px 15px rgba(255,255,255,0.2);
        }

        /* Animations */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        @keyframes bgZoom {
            0% { transform: scale(1); }
            100% { transform: scale(1.1); }
        }

        @keyframes slideUpFade {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes ripple {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 0.6; }
            100% { transform: translate(-50%, -50%) scale(1.6); opacity: 0; }
        }

        @keyframes rotateGlow {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
    </style>
</head>
<body>

    <!-- Background Elements -->
    <div class="bg-container"></div>
    <div class="bg-overlay"></div>

    <!-- Header -->
    <header class="header">
        <div class="menu-btn" onclick="toggleMenu()">
            <i class="fa-solid fa-bars-staggered"></i>
        </div>
        <div class="header-title">ISP TV Online</div>
        <div class="header-spacer"></div>
    </header>

    <!-- Sidebar & Overlay -->
    <div class="overlay" id="overlay" onclick="closeMenu()"></div>
    <nav class="sidebar" id="sidebar">
        <a onclick="closeMenu()" class="menu-item active">
            <i class="fa-solid fa-house"></i> Home
        </a>
        <a href="https://wa.me/8801873228584" target="_blank" class="menu-item">
            <i class="fa-brands fa-whatsapp"></i> WhatsApp
        </a>
        <a href="https://t.me/pro_version_labs" target="_blank" class="menu-item">
            <i class="fa-brands fa-telegram"></i> Telegram
        </a>
        <a href="mailto:samiulmnw9@gmail.com" class="menu-item">
            <i class="fa-solid fa-envelope"></i> Email Support
        </a>
        <a href="mailto:samiulmnw9@gmail.com?subject=SH%20Online%20App%20Report" class="menu-item">
            <i class="fa-solid fa-triangle-exclamation"></i> Report Issue
        </a>
    </nav>

    <!-- Main Content -->
    <main class="main-container">
        <div class="brand-card">
            <i class="fa-solid fa-trophy"></i>
            <h1>TG:🔎 pro_version_labs</h1>
            <p>Join our Telegram channel from the 3 lines on the left side.</p>
        </div>
        
        <div class="live-btn-wrapper">
            <button class="live-btn" onclick="startLiveTV()">
                <i class="fa-solid fa-circle"></i> LIVE NOW
            </button>
        </div>
    </main>

    <!-- No Internet Modal -->
    <div class="modal-wrapper" id="internetModal">
        <div class="error-card">
            <i class="fa-solid fa-wifi"></i>
            <h3>No Connection</h3>
            <p>Please check your cellular data or Wi-Fi network to continue streaming.</p>
            <button class="close-modal-btn" onclick="closeModal()">Try Again</button>
        </div>
    </div>

    <!-- JavaScript -->
    <script>
        // Sidebar Toggle Logic
        function toggleMenu() {
            document.getElementById('sidebar').classList.toggle('active');
            document.getElementById('overlay').classList.toggle('active');
        }
        
        function closeMenu() {
            document.getElementById('sidebar').classList.remove('active');
            document.getElementById('overlay').classList.remove('active');
        }

        // Live TV Redirect & Validation
        function startLiveTV() {
            if (navigator.onLine) {
                // Add a small delay for button animation feel before redirect
                setTimeout(() => {
                    window.location.href = "http://172.20.5.50/";
                }, 300);
            } else {
                document.getElementById('internetModal').classList.add('show');
            }
        }

        // Close Error Modal
        function closeModal() {
            document.getElementById('internetModal').classList.remove('show');
        }

        // Handle Active State in Sidebar
        const menuItems = document.querySelectorAll('.menu-item');
        menuItems.forEach(item => {
            item.addEventListener('click', function() {
                menuItems.forEach(i => i.classList.remove('active'));
                if(this.getAttribute('onclick') !== 'closeMenu()') {
                    this.classList.add('active');
                }
            });
        });
    </script>
</body>
</html>
