<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>⚡ REDFORCE | HYPERSTREAM ACCESS ⚡</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <style>
        /* ========================================= */
        /* ১. রুট ভেরিয়েবল ও বেস স্টাইল */
        /* ========================================= */
        :root {
            --color-primary: #10c0ff; 
            --color-secondary: #ff33cc; 
            --color-bg-dark: #070912;
        }
        
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(180deg, var(--color-bg-dark) 0%, #171d2b 100%);
            color: #e0e0e0;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow: hidden; /* স্ক্রলিং সম্পূর্ণরূপে বন্ধ */
            justify-content: center; /* কেন্দ্রে আনা */
        }

        /* ========================================= */
        /* ২. কেন্দ্রীয় কন্টেইনার (মোবাইল অপটিমাইজড) */
        /* ========================================= */
        .main-stream-container {
            width: 95%;
            max-width: 400px; /* সর্বোচ্চ আকার নিয়ন্ত্রণ */
            text-align: center;
            /* ফুটারের জন্য জায়গা রাখা */
            height: calc(100vh - 60px); 
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        h1 {
            font-size: 1.8em; /* ছোট করা হলো */
            font-weight: 900;
            color: var(--color-primary);
            text-shadow: 0 0 10px var(--color-primary), 0 0 20px var(--color-secondary);
            letter-spacing: 2px;
            margin-bottom: 2px;
        }

        .subtitle {
            font-size: 0.8em; /* ছোট করা হলো */
            color: #888;
            margin-bottom: 30px; /* মার্জিন কমানো হলো */
            font-weight: 500;
        }
        
        /* ========================================= */
        /* ৩. লাইভ স্ট্রিম কার্ড (ফোকাসড) */
        /* ========================================= */
        .live-tv-card {
            background: linear-gradient(135deg, rgba(255, 51, 204, 0.15), rgba(16, 192, 255, 0.1));
            border: 2px solid var(--color-secondary);
            border-radius: 12px; /* সামান্য ছোট করা হলো */
            box-shadow: 0 0 20px rgba(255, 51, 204, 0.7);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 15px; /* প্যাডিং কমানো হলো */
            transition: all 0.5s ease;
            cursor: pointer;
        }

        .tv-icon-group i {
            font-size: 3em; /* ছোট করা হলো */
            color: var(--color-primary);
            animation: pulse 1.5s infinite;
            margin-bottom: 5px;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.8; }
            100% { transform: scale(1); opacity: 1; }
        }

        .status-text {
            font-size: 1em; /* ছোট করা হলো */
            font-weight: 700;
            color: var(--color-secondary);
            margin-bottom: 20px;
        }

        .tv-action-btn {
            background: var(--color-secondary);
            border: none;
            border-radius: 8px; /* ছোট করা হলো */
            padding: 12px 30px; /* প্যাডিং কমানো হলো */
            color: var(--color-bg-dark);
            font-weight: 700;
            font-size: 1em; /* ছোট করা হলো */
            text-transform: uppercase;
            box-shadow: 0 0 10px var(--color-secondary);
            transition: 0.3s;
        }
        .tv-action-btn:hover {
             background: var(--color-primary);
             box-shadow: 0 0 15px var(--color-primary);
             color: white;
             transform: scale(1.05);
        }

        /* ৪. ফুটার (স্থির এবং কমপ্যাক্ট) */
        footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(7, 9, 18, 0.95);
            border-top: 1px solid var(--color-primary);
            padding: 10px 0; /* প্যাডিং কমানো হলো */
            text-align: center;
            font-size: 0.7em; /* ছোট করা হলো */
            color: #666;
            box-shadow: 0 -3px 10px rgba(0, 0, 0, 0.5);
            z-index: 100;
        }
        
        footer strong {
            color: var(--color-primary);
        }
    </style>
</head>
<body>

    <div class="main-stream-container">
        <h1>RED FORCE IPTV</h1>
        <p class="subtitle">Secure Live Stream Access Protocol</p>

        <div class="live-tv-card" id="live-stream-card">
            <div class="tv-icon-group">
                <i class="fas fa-satellite-dish"></i>
            </div>
            <p class="status-text">CLICK TO INITIATE LIVE ACCESS</p>
            <button class="tv-action-btn" id="stream-button">WATCH STREAM NOW</button>
        </div>
    </div>

    <footer>
        <p>Dashboard Coded By <strong>SH HIMEL</strong> | All Rights Reserved © 2028</p>
    </footer>

    <script>
        document.getElementById('stream-button').addEventListener('click', function() {
            const button = this;
            const statusText = document.querySelector('.status-text');

            // অ্যাক্সেস শুরু
            button.textContent = "LOADING...";
            statusText.textContent = "ATTEMPTING IN-APP ACCESS...";
            button.disabled = true;

            // 1 সেকেন্ড পরে রিডাইরেক্ট শুরু
            setTimeout(() => {
                // এই লাইনটি বর্তমান WebView-এর ভেতরেই redforce.live লোড করার চেষ্টা করবে
                window.location.href = 'http://redforce.live/'; 
                
                // যদি লোড না হয় (সার্ভার ব্লক করার কারণে), তবে ব্যবহারকারীকে একটি বার্তা দেওয়া যেতে পারে
                // যদিও এটি এখন আর কার্যকর হবে না, কারণ রিডাইরেক্ট শুরু হয়ে গেছে।
            }, 1000); 
        });
    </script>
</body>
</html>
