<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>⚡ Quantum Stream Portal | Touch Net IPTV ⚡</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Bungee+Inline&family=Roboto:wght@400&display=swap" rel="stylesheet">
    
    <script> 
        if (top != self) { 
            top.location = self.location; 
        } 
    </script>

    <style>
        /* ========================================= */
        /* ১. রুট ভেরিয়েবল ও বেস স্টাইল */
        /* ========================================= */
        :root {
            --color-primary: #00ffff; /* সায়ান */
            --color-secondary: #ff00ff; /* ম্যাজেন্টা */
            --color-accent: #00ff00; /* সবুজ */
            --color-bg: #00000a; /* আল্ট্রা ডার্ক */
            --font-heading: 'Orbitron', sans-serif;
            --font-button: 'Bungee Inline', cursive;
        }
        
        * { box-sizing: border-box; }

        body {
            margin: 0; padding: 0;
            font-family: 'Roboto', sans-serif;
            background-color: var(--color-bg);
            color: #ffffff;
            height: 100vh;
            overflow: hidden;
            perspective: 1000px; /* 3D ইফেক্টের জন্য */
        }
        
        /* ========================================= */
        /* ২. এন্ট্রি স্ক্রিন (3D কিউব ও নিওন) */
        /* ========================================= */
        #entry-screen {
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            height: 100%;
            text-align: center;
            background: radial-gradient(circle at 50% 50%, rgba(30, 0, 70, 0.9), var(--color-bg) 70%);
            animation: bg-scan-line 5s infinite linear;
            transition: opacity 1.5s ease;
        }
        
        @keyframes bg-scan-line {
            0% { background-size: 100% 1px, 100% 1px; background-position: 0% 0%, 0% 100%; }
            50% { background-position: 100% 50%, 0% 50%; }
            100% { background-size: 100% 1px, 100% 1px; background-position: 0% 100%, 0% 0%; }
        }

        .cube-container {
            width: 150px; height: 150px;
            margin-bottom: 50px;
            transform-style: preserve-3d;
            animation: cube-spin 12s infinite linear;
        }
        
        .cube {
            width: 150px; height: 150px;
            transform-style: preserve-3d;
        }
        
        .cube-face {
            position: absolute; width: 150px; height: 150px;
            border: 3px solid var(--color-primary);
            box-shadow: 0 0 20px var(--color-primary), inset 0 0 10px var(--color-secondary);
            opacity: 0.8;
            background: rgba(0, 0, 0, 0.4);
            display: flex; justify-content: center; align-items: center;
            font-family: var(--font-heading);
            font-size: 1.2em;
        }

        .face-front { transform: rotateY(0deg) translateZ(75px); }
        .face-back { transform: rotateY(180deg) translateZ(75px); }
        .face-right { transform: rotateY(90deg) translateZ(75px); }
        .face-left { transform: rotateY(-90deg) translateZ(75px); }
        .face-top { transform: rotateX(90deg) translateZ(75px); }
        .face-bottom { transform: rotateX(-90deg) translateZ(75px); }

        @keyframes cube-spin {
            from { transform: rotateX(0deg) rotateY(0deg) rotateZ(0deg); }
            to { transform: rotateX(360deg) rotateY(360deg) rotateZ(360deg); }
        }

        .app-title {
            font-family: var(--font-heading);
            font-size: 3.5em;
            text-shadow: 0 0 15px var(--color-primary), 0 0 30px var(--color-secondary);
            animation: title-flicker 1s infinite alternate;
        }
        
        @keyframes title-flicker {
             0%, 100% { opacity: 1; } 
             50% { opacity: 0.8; }
        }

        /* LIVE বাটন স্টাইল */
        #live-button {
            padding: 25px 70px;
            font-size: 1.6em;
            font-family: var(--font-button);
            background: linear-gradient(45deg, var(--color-secondary), var(--color-primary));
            color: var(--color-bg);
            border: 5px solid var(--color-accent);
            border-radius: 5px;
            box-shadow: 0 0 40px rgba(255, 0, 255, 0.9), 0 0 60px var(--color-primary);
            transition: all 0.3s ease;
            text-shadow: 2px 2px 0 var(--color-bg);
        }

        #live-button:active {
            transform: scale(0.95);
            box-shadow: 0 0 20px var(--color-accent);
        }

        /* ========================================= */
        /* ৩. অ্যাপ ভিউ স্টাইল */
        /* ========================================= */
        #app-view {
            display: none;
            height: 100%; width: 100%;
            flex-direction: column;
            position: relative;
        }
        
        .app-nav-bar {
            background: rgba(0, 0, 0, 0.95);
            color: var(--color-primary);
            padding: 10px;
            text-align: center;
            font-family: var(--font-heading);
            font-size: 1em;
            border-bottom: 3px solid var(--color-secondary);
        }

        #main-iframe {
            width: 100%; height: 100%;
            border: none;
            display: block;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.5);
        }
        
        /* ========================================= */
        /* ৪. ইউনিক ফুটার স্টাইল */
        /* ========================================= */
        .unique-footer {
            position: absolute; bottom: 0; left: 0; right: 0;
            padding: 10px 0;
            background: rgba(0, 0, 0, 0.9);
            text-align: center;
            font-family: 'Roboto', sans-serif;
            font-size: 0.85em;
            border-top: 1px dashed var(--color-accent);
            box-shadow: 0 -5px 15px rgba(0, 255, 0, 0.2);
        }
        
        .creator-text {
            color: #fff;
            margin: 0;
            /* ডায়নামিক টেক্সট ইফেক্ট */
            animation: text-glitch 4s infinite alternate;
        }
        
        .creator-highlight {
            color: var(--color-accent);
            text-shadow: 0 0 5px var(--color-accent);
            font-weight: 700;
        }

        @keyframes text-glitch {
            0% { transform: translate(0, 0); }
            20% { transform: translate(-1px, 1px); }
            40% { transform: translate(1px, -1px); }
            60% { transform: translate(-1px, -1px); }
            80% { transform: translate(1px, 1px); }
            100% { transform: translate(0, 0); }
        }
    </style>
    </head>
<body>

    <div id="entry-screen">
        
        <div class="cube-container">
            <div class="cube">
                <div class="cube-face face-front">LIVE</div>
                <div class="cube-face face-back">HD</div>
                <div class="cube-face face-right">VR</div>
                <div class="cube-face face-left">NET</div>
                <div class="cube-face face-top">24/7</div>
                <div class="cube-face face-bottom">STREAM</div>
            </div>
        </div>
        
        <h1 class="app-title">Touch net ip TV <br><span style="font-size: 0.4em;">Hyper Stream Portal</span></h1>
        
        <button id="live-button">
            ⚡ ENTER LIVE STREAM ⚡
        </button>

    </div>

    <div id="app-view">
        <div class="app-nav-bar">
            🟢 Quantum Stream Active | Touch Net IP TV
        </div>
        
        <iframe 
            id="main-iframe"
            src="http://redforce.live/" allow="autoplay; fullscreen; picture-in-picture; xr-spatial-tracking" 
            title="Live Stream Viewer"
        ></iframe>
    </div>
    
    <footer class="unique-footer">
        <p class="creator-text">
            Project Created By <span class="creator-highlight">**SH Himel**</span> | © 2024–2029
        </p>
    </footer>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const liveButton = document.getElementById('live-button');
            const entryScreen = document.getElementById('entry-screen');
            const appView = document.getElementById('app-view');
            const mainIframe = document.getElementById('main-iframe');
            
            // ১. লাইভ বাটনে ক্লিক করলে
            liveButton.addEventListener('click', () => {
                entryScreen.style.opacity = '0';
                
                // গ্যারান্টিড লোডিং: 500ms পরে স্ক্রিন সরাতে হবে, iFrame লোড হোক বা না হোক
                setTimeout(() => {
                    entryScreen.style.display = 'none';
                    appView.style.display = 'flex'; 
                    // iFrame লোড শুরু হবে
                    mainIframe.src = "http://redforce.live/"; // ⬅️⬅️⬅️ এখানেই আপনার কার্যকর লিংকটি বসান (২য় স্থান)
                    
                }, 500); 
            });

            // প্রিলোডার ফিক্স: DOM লোড হলেই প্রিলোডারটি সরাতে হবে
            setTimeout(() => {
                document.getElementById('entry-screen').style.opacity = '1';
            }, 100);

            // ২. ফুলস্ক্রিন ও অটো রোটেট লজিক 
            document.addEventListener('fullscreenchange', () => {
                console.log("Fullscreen request triggered. Check WebView settings for auto-rotation.");
            });

            // ৩. কনসোল বার্তা
            console.log("--- GEMINI'S BEST EFFORT CODE LOADED ---");
            console.log("PROJECT: Quantum Stream Portal | STATUS: Awaiting Valid iFrame Source.");
            console.log("-----------------------------------------");
        });
    </script>
    </body>
</html>
